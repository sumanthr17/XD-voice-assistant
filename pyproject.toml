[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xd-ai"
version = "0.1.0"
description = "A modular, text-first personal AI assistant."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "XD AI Contributors" }]
dependencies = [
    "google-genai>=2.31.0,<3.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
xd-ai = "xd_ai.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/xd_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

